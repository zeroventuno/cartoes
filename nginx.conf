server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Behind Traefik: keep redirects relative so /slug -> /slug/ stays on https and the public host
  absolute_redirect off;
  server_tokens off;

  types {
    text/html html;
    text/css css;
    text/javascript js;
    application/manifest+json webmanifest;
    image/svg+xml svg;
    image/webp webp;
    image/jpeg jpg jpeg;
    image/png png;
    font/woff2 woff2;
    video/mp4 mp4;
    text/vcard vcf;
  }

  # The bare address has no card of its own
  location = / { return 302 https://zeroventuno.com/; }

  # Hidden files and folders never leave the server
  location ~ /\. { return 404; }

  # Media and fonts: a day of cache (rename a file to replace it at once)
  location ~* ^/[^/]+/assets/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # Pages: always revalidate, so data changes show up right away
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
